name: ChipPilot distribution

on:
  push:
    branches: ['develop']
    paths: ['chippilot-release.json']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix packages/agent-connector
      - run: node --test packages/agent-collaboration/test/*.test.js
      - run: node --test --test-name-pattern=help packages/agent-connector/test/cli.test.js
      - run: node scripts/build-chippilot-cli.cjs
      - name: Test the installed archive independently of the checkout
        run: |
          CHIPPILOT_NO_PATH=1 CHIPPILOT_INSTALL_ROOT="$RUNNER_TEMP/installed-cli" CHIPPILOT_ARCHIVE_PATH="$PWD/artifacts/chippilot/chippilot-cli.tgz" bash install.sh
          "$RUNNER_TEMP/installed-cli/nodejs/node_modules/.bin/agn" version
          node scripts/check-chippilot-install.cjs "$RUNNER_TEMP/installed-cli"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-release
          path: artifacts/chippilot/*
          if-no-files-found: error
  desktop:
    needs: cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-22.04
            target: linux
            arch: x64
          - os: macos-15-intel
            target: mac
            arch: x64
          - os: macos-15
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: cli-release
          path: artifacts/chippilot
      - run: node scripts/prepare-chippilot-desktop.mjs
      - run: npm install --no-audit --no-fund
        working-directory: packages/launcher
      - run: npm ci --no-audit --no-fund
        working-directory: workspace/frontend
      - run: npm run typecheck
        working-directory: packages/launcher
      - name: Test deployment, authentication and workspace navigation
        working-directory: packages/launcher
        run: npx vitest run --maxWorkers=2 src/shared/deployment.test.ts src/main/auth/oidc.test.ts src/main/auth/account.test.ts src/main/auth/endpoints.test.ts src/renderer/lib/workspace-urls.test.ts src/renderer/lib/workspace-navigation.test.tsx src/renderer/components/workspaces/WorkspaceQuickConnect.test.tsx src/renderer/pages/agents/index.test.tsx
      - run: npm run build
        working-directory: packages/launcher
      - name: Package native desktop application (unsigned)
        working-directory: packages/launcher
        run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            packages/launcher/dist/*.exe
            packages/launcher/dist/*.msi
            packages/launcher/dist/*.dmg
            packages/launcher/dist/*.zip
            packages/launcher/dist/*.AppImage
            packages/launcher/dist/*.deb
            packages/launcher/dist/*.blockmap
            packages/launcher/dist/latest*.yml
          if-no-files-found: error
  publish:
    needs: [cli, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - run: npm install --prefix "$RUNNER_TEMP/release-tools" --ignore-scripts --no-audit --no-fund js-yaml@4.1.0
      - name: Publish the CLI and all native desktop builds to this fork
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_PATH: ${{ runner.temp }}/release-tools/node_modules
        run: node scripts/publish-chippilot.cjs release-artifacts
